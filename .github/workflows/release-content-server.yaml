name: Release Content Server

on:
  workflow_call:
    inputs:
      version:
        description: Content server version to release (e.g. "0.0.2").
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Content server version to release (e.g. "0.0.2").
        type: string
        required: true

permissions:
  contents: write
  packages: write

jobs:
  # ── Cross-compile binaries for every supported platform ──────────────────────
  binaries:
    name: Compile — ${{ matrix.suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: bun-linux-x64,        suffix: linux-x64         }
          - { target: bun-linux-x64-musl,   suffix: linux-x64-musl    }
          - { target: bun-linux-arm64,      suffix: linux-arm64       }
          - { target: bun-linux-arm64-musl, suffix: linux-arm64-musl  }
          - { target: bun-darwin-x64,       suffix: darwin-x64        }
          - { target: bun-darwin-arm64,     suffix: darwin-arm64      }
          - { target: bun-windows-x64,      suffix: windows-x64,  ext: .exe }
          - { target: bun-windows-arm64,    suffix: windows-arm64, ext: .exe }
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @sparkium/types
        run: pnpm exec nx run @sparkium/types:build

      - name: Compile binary
        run: |
          bun build apps/content-server/src/index.ts \
            --compile \
            --target=${{ matrix.target }} \
            --minify \
            --bytecode \
            --sourcemap \
            --outfile apps/content-server/dist/content-server-${{ matrix.suffix }}${{ matrix.ext || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.suffix }}
          path: apps/content-server/dist/content-server-${{ matrix.suffix }}${{ matrix.ext || '' }}
          if-no-files-found: error

  # ── Create GitHub release and attach all binaries ────────────────────────────
  release:
    name: Publish GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: "@sparkium/content-server@${{ inputs.version }}"
          name: "Content Server v${{ inputs.version }}"
          generate_release_notes: true
          files: dist/*

  # ── Build multi-arch Docker images and push to registries ────────────────────
  container:
    name: Build and Push Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        env:
          VERSION: ${{ inputs.version }}
        run: |
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          {
            echo "value<<EOF"
            echo "ghcr.io/sparkium/content-server:latest"
            echo "ghcr.io/sparkium/content-server:$VERSION"
            echo "ghcr.io/sparkium/content-server:$MAJOR"
            echo "ghcr.io/sparkium/content-server:$MAJOR.$MINOR"
            echo "sparkium/content-server:latest"
            echo "sparkium/content-server:$VERSION"
            echo "sparkium/content-server:$MAJOR"
            echo "sparkium/content-server:$MAJOR.$MINOR"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        env:
          INPUT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PUSH: "true"
          INPUT_PLATFORMS: "linux/amd64,linux/arm64"
          INPUT_TAGS: ${{ steps.tags.outputs.value }}
        run: pnpm nx run @sparkium/content-server:container
